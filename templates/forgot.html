{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="card auth-card">
    <h1 class="serif" style="font-size:2rem">Forgot password</h1>
    <p class="muted">This prototype does not send email. Use a demo login for judging.</p>
    <form method="post">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <p><button class="btn primary full" type="submit" style="margin-top:1rem">Request reset</button></p>
    </form>
    <a href="{{ url_for('login') }}">Back to sign in</a>
  </div>
</div>
{% endblock %}
